<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Variable BPM Clock</title>
<meta name="theme-color" content="#111412">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&family=Lexend:wght@400;600;700&family=League+Spartan:wght@500;700&family=Afacad:wght@500;700&family=Orbitron:wght@500;700&family=Space+Grotesk:wght@500;700&family=DM+Serif+Display:ital@0;1&family=Silkscreen:wght@400;700&family=Press+Start+2P&display=swap');
  :root {
    color-scheme: light dark;
    --bg:#f6f6f4;
    --fg:#171717;
    --muted:#8a8a86;
    --ring:#cfcfca;
    --accent:#b24a4a;
    --accent-2:#d68a72;
    --accent-3:#7d2f43;
    --subtle:rgba(23,23,23,.42);
    --face-fill:transparent;
    --page-bg:var(--bg);
    --clock-font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --clock-text-scale:1.5;
  }

  * { box-sizing:border-box; }

  html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--page-bg);
    color:var(--fg);
  }

  body {
    min-height:100vh;
    display:grid;
    grid-template-rows:1fr auto 1fr;
    padding:0.35rem 0.5rem 0.5rem;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }


  .bottom,
  .panel,
  .tempo-panel,
  .advanced-panel,
  .menu-button,
  .control-group,
  .control-label,
  .cycle,
  .cycle-value,
  .tempo-panel button,
  .advanced-panel button {
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif !important;
  }

  .clock-row {
    grid-row:2;
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:0;
    min-height:0;
    width:100%;
  }

  #clock {
    position:relative;
    width:min(94vw,calc(100vh - 4.75rem),44rem);
    aspect-ratio:1;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    outline:none;
    flex:0 0 auto;
  }

  #clock svg {
    display:block;
    width:100%;
    height:100%;
    overflow:visible;
    position:relative;
    z-index:1;
  }

  .faceFill { fill:var(--face-fill); }
  .outer { fill:none; stroke:var(--fg); stroke-width:0.084375rem; }
  .inner { fill:none; stroke:var(--ring); stroke-width:0.05rem; }
  .tick { stroke:var(--muted); stroke-linecap:round; transition:opacity .2s ease; }
  .major { stroke:var(--fg); stroke-width:0.15rem; }
  .minor { stroke-width:0.0625rem; opacity:.58; }

  .hour { stroke:var(--fg); stroke-width:0.34375rem; stroke-linecap:round; }
  .minute { stroke:var(--fg); stroke-width:0.19375rem; stroke-linecap:round; opacity:.9; }
  .second { stroke:var(--accent); stroke-width:0.1125rem; stroke-linecap:round; }
  .hub { fill:var(--fg); }
  .pulse {
    fill:none;
    stroke:var(--ring);
    stroke-width:0.0625rem;
    opacity:.2;
    transform-box:fill-box;
    transform-origin:center;
  }

  #timeReadout {
    position:absolute;
    left:50%;
    top:50%;
    z-index:5;
    transform:translate(-50%,-50%) scale(var(--clock-text-scale));
    transform-origin:center;
    font:500 clamp(1.75rem,6.4vw,2.875rem)/1 var(--clock-font);
    letter-spacing:0;
    color:var(--muted);
    opacity:.48;
    pointer-events:none;
    white-space:nowrap;
    transition:filter .18s ease, opacity .18s ease, transform .18s ease;
  }

  body[data-analog-text="off"] #timeReadout {
    opacity:0 !important;
  }

  body[data-text-blur="on"] #timeReadout,
  body[data-text-blur="on"] .digitalFace .df-main,
  body[data-text-blur="on"] .digitalFace .df-hour,
  body[data-text-blur="on"] .digitalFace .df-minute,
  body[data-text-blur="on"] .digitalFace .df-second {
    filter:blur(0.11rem);
  }

  /*
    Fixed character slots:
    - every slot itself has zero width
    - slot anchors are separated by a fixed em step
    - the glyph is centered on its anchor
    This prevents proportional font metrics from moving the time display.
  */
  .slotted-time {
    --slot-step:0.6825em;
    position:relative;
    display:inline-block;
    width:calc((var(--slot-count) - 1) * var(--slot-step));
    height:1em;
    line-height:1;
    letter-spacing:0 !important;
    white-space:nowrap;
  }

  .slotted-time .time-slot {
    position:absolute;
    top:0;
    left:calc(var(--slot-index) * var(--slot-step));
    width:0;
    height:1em;
    line-height:1;
    overflow:visible;
  }

  .slotted-time .time-glyph {
    position:absolute;
    top:0;
    left:0;
    transform:translateX(-50%);
    width:max-content;
    height:1em;
    line-height:1;
    text-align:center;
    white-space:pre;
  }

  .bottom {
    grid-row:3;
    align-self:end;
    width:100%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    min-width:0;
    position:relative;
    bottom:1.25rem;
  }

  .panel {
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:1.375rem;
    min-height:2.625rem;
    line-height:1;
    font-size:0.8125rem;
    letter-spacing:.02em;
  }

  .tempo-panel[hidden],
  .advanced-panel[hidden] {
    display:none !important;
  }

  .tempo-panel button,
  .advanced-panel button,
  .menu-button {
    appearance:none;
    border:0;
    background:transparent;
    color:var(--muted);
    font:inherit;
    cursor:pointer;
  }

  .tempo-panel button {
    padding:0.5rem 0.125rem;
    opacity:.66;
  }

  .tempo-panel button[aria-pressed="true"] {
    color:var(--fg);
    opacity:1;
  }

  .advanced-panel {
    gap:1rem;
    flex-wrap:wrap;
    row-gap:0.55rem;
    max-width:100%;
  }

  .control-group {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    gap:0.3125rem;
  }

  .control-label {
    font-size:0.625rem;
    line-height:1;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    opacity:.38;
    pointer-events:none;
  }

  .cycle {
    display:flex;
    align-items:center;
    gap:0.4375rem;
    min-width:7.25rem;
    justify-content:center;
  }

  .volume-cycle {
    min-width:10.5rem;
    gap:0.25rem;
  }

  .volume-bars {
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:0.08rem;
    min-width:6.5rem;
    letter-spacing:0;
    line-height:1;
    user-select:none;
  }

  .volume-bars span {
    font-size:0.9rem;
    opacity:0.22;
    transition:opacity .14s ease, transform .14s ease;
    transform:translateY(0);
  }

  .volume-bars span[data-on="true"] {
    opacity:0.98;
    transform:translateY(-0.02rem);
  }

  .volume-bars span:nth-child(1) { color:#383838; }
  .volume-bars span:nth-child(2) { color:#4d4d4d; }
  .volume-bars span:nth-child(3) { color:#626262; }
  .volume-bars span:nth-child(4) { color:#777777; }
  .volume-bars span:nth-child(5) { color:#8c8c8c; }
  .volume-bars span:nth-child(6) { color:#a1a1a1; }
  .volume-bars span:nth-child(7) { color:#b6b6b6; }
  .volume-bars span:nth-child(8) { color:#cbcbcb; }
  .volume-bars span:nth-child(9) { color:#dfdfdf; }
  .volume-bars span:nth-child(10){ color:#f3f3f3; }

  .cycle button {
    padding:0.375rem 0.1875rem;
    min-width:1.25rem;
    color:var(--fg);
    opacity:.8;
  }

  .cycle-value {
    min-width:4rem;
    text-align:center;
    color:var(--fg);
    opacity:.9;
  }

  .font-value {
    min-width:7.25rem;
    font-size:0.75rem;
    line-height:1.05;
  }

  .size-cycle {
    min-width:7.2rem;
    gap:0.25rem;
  }

  .size-bars {
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:0.14rem;
    min-width:3.9rem;
    line-height:1;
    user-select:none;
  }

  .size-bars span {
    font-size:0.9rem;
    opacity:0.22;
    transition:opacity .14s ease, transform .14s ease;
  }

  .size-bars span[data-on="true"] {
    opacity:0.98;
    transform:translateY(-0.02rem);
  }

  .size-bars span:nth-child(1) { color:color-mix(in srgb, var(--fg) 75%, var(--accent) 25%); }
  .size-bars span:nth-child(2) { color:color-mix(in srgb, var(--fg) 55%, var(--accent) 45%); }
  .size-bars span:nth-child(3) { color:color-mix(in srgb, var(--fg) 35%, var(--accent-2) 65%); }
  .size-bars span:nth-child(4) { color:color-mix(in srgb, var(--fg) 16%, var(--accent-3) 84%); }
  .size-bars span:nth-child(5) { color:color-mix(in srgb, var(--fg) 5%, var(--accent-3) 95%); }


  .font-size-cycle {
    min-width:7.2rem;
    gap:0.25rem;
  }

  .font-size-bars {
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:0.14rem;
    min-width:3.9rem;
    line-height:1;
    user-select:none;
  }

  .font-size-bars span {
    font-size:0.9rem;
    opacity:0.22;
    transition:opacity .14s ease, transform .14s ease;
  }

  .font-size-bars span[data-on="true"] {
    opacity:0.98;
    transform:translateY(-0.02rem);
  }

  .font-size-bars span:nth-child(1) { color:#5a5a5a; }
  .font-size-bars span:nth-child(2) { color:#777777; }
  .font-size-bars span:nth-child(3) { color:#969696; }
  .font-size-bars span:nth-child(4) { color:#b9b9b9; }
  .font-size-bars span:nth-child(5) { color:#dddddd; }

  .toggle-control {
    min-width:3.6rem;
  }

  .binary-toggle {
    min-width:2rem !important;
    min-height:2rem;
    padding:0.25rem !important;
    display:grid;
    place-items:center;
    color:var(--fg) !important;
    opacity:.9 !important;
  }

  .toggle-dot {
    display:block;
    width:0.82rem;
    height:0.82rem;
    border-radius:50%;
    border:0.12rem solid currentColor;
    background:currentColor;
    box-sizing:border-box;
  }

  .binary-toggle[data-enabled="false"] {
    color:var(--muted) !important;
    opacity:.58 !important;
  }

  .binary-toggle[data-enabled="false"] .toggle-dot {
    background:transparent;
  }

  .menu-button {
    position:absolute;
    right:0;
    bottom:0;
    min-width:2.375rem;
    min-height:2.375rem;
    display:grid;
    place-items:center;
    padding:0;
    font-size:1.1875rem;
    line-height:1;
    color:var(--muted);
    opacity:.72;
  }

  button:focus-visible,
  #clock:focus-visible {
    outline:0.0625rem solid var(--fg);
    outline-offset:0.1875rem;
    border-radius:0.1875rem;
  }

  /* Face variants */
  .watchDecor {
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
  }

  .watchDecor .band {
    fill:var(--ring);
    opacity:.14;
  }

  .watchDecor .accentBand {
    fill:var(--accent);
    opacity:.15;
  }

  .watchDecor .core {
    fill:var(--fg);
    opacity:.035;
  }

  .watchDecor .cut {
    fill:var(--bg);
  }

  .watchDecor .line {
    fill:none;
    stroke:var(--ring);
    stroke-width:0.045rem;
    opacity:.48;
    stroke-linecap:round;
    stroke-linejoin:round;
    vector-effect:non-scaling-stroke;
  }

  .watchDecor .softLine {
    fill:none;
    stroke:var(--accent);
    stroke-width:0.055rem;
    opacity:.30;
    stroke-linecap:round;
    vector-effect:non-scaling-stroke;
  }

  .watchDecor .marker {
    fill:var(--accent);
    opacity:.68;
  }

  .watchDecor .marker2 {
    fill:var(--accent-2);
    opacity:.72;
  }

  .watchDecor .marker3 {
    fill:var(--accent-3);
    opacity:.72;
  }

  .watchDecor .gradientFill {
    fill:url(#themeGradient);
    opacity:.52;
  }

  .watchDecor .gradientFillSoft {
    fill:url(#themeGradientSoft);
    opacity:.34;
  }

  .watchDecor .gradientStroke {
    fill:none;
    stroke:url(#themeGradient);
    stroke-width:0.5rem;
    opacity:.72;
    stroke-linecap:round;
    vector-effect:non-scaling-stroke;
  }

  .watchDecor .gradientStrokeThin {
    fill:none;
    stroke:url(#themeGradient);
    stroke-width:0.18rem;
    opacity:.62;
    stroke-linecap:round;
    vector-effect:non-scaling-stroke;
  }

  .watchDecor .softGlow {
    fill:url(#softGlow);
    opacity:.78;
  }

  .watchDecor .coolGlow {
    fill:url(#coolGlow);
    opacity:.72;
  }

  body[data-face="1"] .inner { opacity:1; }
  body[data-face="1"] .minor { opacity:.72; }
  body[data-face="1"] .major { opacity:1; }

  body[data-face="2"] .inner { opacity:.18; }
  body[data-face="2"] .minor { opacity:.30; }
  body[data-face="2"] .major { opacity:.92; }
  body[data-face="2"] .outer { stroke-width:0.1375rem; }

  body[data-face="3"] .inner { stroke-dasharray:0.1375rem 0.3375rem; opacity:.6; }
  body[data-face="3"] .minor { opacity:.18; }
  body[data-face="3"] .major { stroke-width:0.2rem; }
  body[data-face="3"] .hour { stroke-width:0.4125rem; }
  body[data-face="3"] .minute { stroke-width:0.14375rem; }

  body[data-face="4"] .watch4 { opacity:1; }
  body[data-face="4"] .inner { opacity:.08; }
  body[data-face="4"] .minor { opacity:.18; }
  body[data-face="4"] .major { opacity:.86; stroke-width:0.16rem; }
  body[data-face="4"] .outer { stroke-width:0.1125rem; }

  body[data-face="5"] .watch5 { opacity:1; }
  body[data-face="5"] .inner { opacity:.05; }
  body[data-face="5"] .minor { opacity:.14; }
  body[data-face="5"] .major { opacity:.84; stroke-width:0.17rem; }
  body[data-face="5"] .outer { stroke-width:0.125rem; }

  body[data-face="6"] .inner { opacity:.04; }
  body[data-face="6"] .minor { opacity:.16; }
  body[data-face="6"] .major { opacity:.88; stroke-width:0.17rem; }
  body[data-face="6"] .outer { stroke-width:0.11875rem; }

  body[data-face="7"] .minor { opacity:.13; }

  body[data-face="7"] .outer { stroke-width:0.1125rem; }

  body[data-face="11"] .outer { stroke-width:0.11875rem; }

  body[data-face="12"] .watch12 { opacity:1; }

  body[data-face="18"] .outer { stroke-width:0.1125rem; }


  /* Digital faces */
  .digitalFace {
    position:absolute;
    inset:0;
    z-index:5;
    display:none;
    color:var(--fg);
    pointer-events:none;
    font-variant-numeric:tabular-nums;
  }

  body[data-face="19"] #clock svg,
  body[data-face="20"] #clock svg,
  body[data-face="21"] #clock svg,
  body[data-face="22"] #clock svg,
  body[data-face="23"] #clock svg,
  body[data-face="24"] #clock svg,
  body[data-face="25"] #clock svg,
  body[data-face="26"] #clock svg,
  body[data-face="19"] #timeReadout,
  body[data-face="20"] #timeReadout,
  body[data-face="21"] #timeReadout,
  body[data-face="22"] #timeReadout,
  body[data-face="23"] #timeReadout,
  body[data-face="24"] #timeReadout,
  body[data-face="25"] #timeReadout,
  body[data-face="26"] #timeReadout {
    opacity:0;
  }

  body[data-face="19"] .digital19,
  body[data-face="20"] .digital20,
  body[data-face="21"] .digital21,
  body[data-face="22"] .digital22,
  body[data-face="23"] .digital23,
  body[data-face="24"] .digital24,
  body[data-face="25"] .digital25,
  body[data-face="26"] .digital26 {
    display:flex;
  }

  .digitalFace .df-main,
  .digitalFace .df-hour,
  .digitalFace .df-minute,
  .digitalFace .df-second {
    font-family:var(--clock-font);
    font-weight:600;
    letter-spacing:0;
  }


  .digitalFace .df-main,
  .digitalFace .df-hour,
  .digitalFace .df-minute,
  .digitalFace .df-second {
    transform:scale(var(--clock-text-scale));
    transform-origin:center;
    transition:filter .18s ease, transform .18s ease;
  }

  .digitalFace .df-second {
    color:var(--accent);
  }

  .digitalFace .df-meta {
    font-size:0.625rem;
    line-height:1;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    opacity:.62;
  }

  .digitalFace .df-line {
    background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent-3));
  }

  /* 19 - clean rectangular display */
  .digital19 {
    align-items:center;
    justify-content:center;
  }

  .digital19 .panel {
    width:82%;
    min-height:42%;
    border:0.075rem solid var(--ring);
    border-radius:0.45rem;
    background:linear-gradient(145deg,var(--face-fill),transparent);
    display:grid;
    grid-template-columns:1fr auto;
    align-items:end;
    padding:1.35rem 1.45rem 1.15rem;
    position:relative;
    overflow:hidden;
  }

  .digital19 .panel::before {

  let bpm = 80;
  let hoursPerDay = 32;
  let beatMs = 60000 / bpm;
  let faceIndex = 1;
  let colorIndex = 1;
  let fontIndex = 1;
  let fontSizeLevel = 1;
  let volumeLevel = 5;
  let sizeLevel = 3;
  let soundOn = true;
  let analogTextOn = true;
  let textBlurOn = false;
  let smoothSecondsOn = false;
  const FACE_COUNT = 26;
  const COLOR_COUNT = 22;
  const FONT_COUNT = 10;

  let audioCtx = null;
  let mainBuffer = null;
  let subBuffer = null;
  let audioReady = false;
  let schedulerTimer = null;
  let schedulerGeneration = 0;
  let lastScheduledBeatKey = null;
  const scheduledSources = new Set();

  const settings = {
    40: { hours:16, divisions:16 },
    60: { hours:24, divisions:24 },
    80: { hours:32, divisions:32 }
  };

  const fontOptions = [
    { name:'System', css:'system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' },
    { name:'Josefin Sans', css:'"Josefin Sans",system-ui,sans-serif' },
    { name:'Lexend', css:'"Lexend",system-ui,sans-serif' },
    { name:'League Spartan', css:'"League Spartan",system-ui,sans-serif' },
    { name:'Afacad', css:'"Afacad",system-ui,sans-serif' },
    { name:'Orbitron', css:'"Orbitron",system-ui,sans-serif' },
    { name:'Space Grotesk', css:'"Space Grotesk",system-ui,sans-serif' },
    { name:'DM Serif', css:'"DM Serif Display",Georgia,serif' },
    { name:'Silkscreen', css:'"Silkscreen",system-ui,sans-serif' },
    { name:'Press Start', css:'"Press Start 2P",system-ui,sans-serif' }
  ];

  // Measured strong-transient positions in the uploaded MP3 files.
  const MAIN_ONSET_SEC = 0.0462;
  const SUB_ONSET_SEC = 0.0493;

  function drawMarks(divisions) {
    marks.replaceChildren();

    // One visible marker per audible tick in one full revolution.
    // 40 BPM -> 40 positions, 60 BPM -> 60, 80 BPM -> 80.
    const positions = bpm;
    const gradeEvery = bpm === 60 ? 5 : 4;

    for (let i = 0; i < positions; i++) {
      const a = (i / positions) * Math.PI * 2 - Math.PI / 2;
      const major = i % gradeEvery === 0;

      // Denser 80-position mode gets slightly shorter minor marks.
      const minorInner =
        bpm === 80 ? 167 :
        bpm === 60 ? 165 :
        163;

      const r1 = major ? 156 : minorInner;
      const r2 = 176;

      const line = document.createElementNS(NS,'line');
      line.setAttribute('x1', 200 + Math.cos(a) * r1);
      line.setAttribute('y1', 200 + Math.sin(a) * r1);
      line.setAttribute('x2', 200 + Math.cos(a) * r2);
      line.setAttribute('y2', 200 + Math.sin(a) * r2);
      line.setAttribute('class', 'tick ' + (major ? 'major' : 'minor'));
      marks.appendChild(line);
    }
  }

  function localMillis(now) {
    return now.getHours() * 3600000 +
           now.getMinutes() * 60000 +
           now.getSeconds() * 1000 +
           now.getMilliseconds();
  }

  function pad2(n) {
    return String(n).padStart(2,'0');
  }

  function renderSlotted(element, text) {
    if (!element || element.dataset.slotText === text) return;

    element.dataset.slotText = text;
    element.classList.add('slotted-time');
    element.style.setProperty('--slot-count', String(text.length));

    const fragment = document.createDocumentFragment();

    Array.from(text).forEach((character, index) => {
      const slot = document.createElement('span');
      slot.className = 'time-slot';
      slot.style.setProperty('--slot-index', String(index));

      const glyph = document.createElement('span');
      glyph.className = 'time-glyph';
      glyph.textContent = character;

      slot.appendChild(glyph);
      fragment.appendChild(slot);
    });

    element.replaceChildren(fragment);
  }

  function getClockState(now) {
    const realMs = localMillis(now);
    const clockDayMs = hoursPerDay * 60 * 60 * 1000;
    const clockMs = (realMs / 86400000) * clockDayMs;
    const totalSeconds = clockMs / 1000;

    return {
      totalSeconds,
      h: Math.floor(totalSeconds / 3600) % hoursPerDay,
      m: Math.floor(totalSeconds / 60) % 60,
      s: Math.floor(totalSeconds) % 60
    };
  }

  function draw() {
    const state = getClockState(new Date());

    const now = new Date();
    const realMs = localMillis(now);
    const beatPhase = realMs / beatMs;
    const rawBeatPosition = smoothSecondsOn
      ? beatPhase
      : Math.floor(beatPhase);
    const beatPosition = ((rawBeatPosition % bpm) + bpm) % bpm;
    const beatAngle = beatPosition * (360 / bpm);

    const minutesContinuous = (state.totalSeconds / 60) % 60;
    const hoursContinuous = (state.totalSeconds / 3600) % hoursPerDay;

    // One full revolution is exactly bpm ticks:
    // 40 ticks at 40 BPM, 60 at 60 BPM, 80 at 80 BPM.
    secondHand.setAttribute(
      'transform',
      `rotate(${beatAngle} 200 200)`
    );

    minuteHand.setAttribute(
      'transform',
      `rotate(${minutesContinuous * 6} 200 200)`
    );

    hourHand.setAttribute(
      'transform',
      `rotate(${hoursContinuous * (360 / hoursPerDay)} 200 200)`
    );

    const hh = pad2(state.h);
    const mm = pad2(state.m);
    const ss = pad2(state.s);

    renderSlotted(readout, `${hh}:${mm}:${ss}`);
    digitalHours.forEach(el => renderSlotted(el, hh));
    digitalMinutes.forEach(el => renderSlotted(el, mm));
    digitalSeconds.forEach(el => renderSlotted(el, ss));
    digitalHM.forEach(el => renderSlotted(el, `${hh}:${mm}`));

    requestAnimationFrame(draw);
  }

  async function decodeDataUri(uri) {
    const comma = uri.indexOf(',');
    const bytes = atob(uri.slice(comma + 1));
    const array = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) {
      array[i] = bytes.charCodeAt(i);
    }
    return audioCtx.decodeAudioData(array.buffer);
  }

  async function enableSound() {
    if (!soundOn) return;

    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    if (!mainBuffer || !subBuffer) {
      [mainBuffer, subBuffer] = await Promise.all([
        decodeDataUri(MAIN_URI),
        decodeDataUri(SUB_URI)
      ]);
    }

    audioReady = true;
    restartScheduler();
  }

  function outputLatencySeconds() {
    const base = Number.isFinite(audioCtx?.baseLatency) ? audioCtx.baseLatency : 0;
    const out = Number.isFinite(audioCtx?.outputLatency) ? audioCtx.outputLatency : 0;
    return base + out;
  }

  function epochMsToAudioTime(epochMs) {
    const targetPerfSec = (epochMs - performance.timeOrigin) / 1000;
    const audioMinusPerf = audioCtx.currentTime - (performance.now() / 1000);
    return targetPerfSec + audioMinusPerf;
  }

  function playBufferAt(buffer, gainValue, when, offsetSeconds, maxDuration, playbackRate = 1) {
    if (!soundOn || !audioReady || !audioCtx || !buffer) return;

    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();

    gain.gain.value = gainValue * volumeScale();
    src.buffer = buffer;
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src._targetEpoch = when;
    scheduledSources.add(src);
    src.onended = () => scheduledSources.delete(src);

    const safeWhen = Math.max(audioCtx.currentTime + 0.003, when);
    const safeOffset = Math.min(
      Math.max(0, offsetSeconds),
      Math.max(0, buffer.duration - 0.01)
    );

    src.playbackRate.setValueAtTime(playbackRate, safeWhen);

    const available = Math.max(0.01, buffer.duration - safeOffset);
    const duration = Math.min(Math.max(0.01, maxDuration), available);

    src.start(safeWhen, safeOffset, duration);
  }

  function animatePulse() {
    if (
      pulse.animate &&
      !matchMedia('(prefers-reduced-motion: reduce)').matches
    ) {
      pulse.animate(
        [
          { transform:'scale(1)', opacity:.32 },
          { transform:'scale(1.018)', opacity:.07 },
          { transform:'scale(1)', opacity:.20 }
        ],
        { duration:260, easing:'ease-out' }
      );
    }
  }

  function setBpm(nextBpm) {
    bpm = nextBpm;
    hoursPerDay = settings[bpm].hours;
    beatMs = 60000 / bpm;

    drawMarks(settings[bpm].divisions);

    tempoButtons.forEach(button => {
      button.setAttribute(
        'aria-pressed',
        Number(button.dataset.bpm) === bpm ? 'true' : 'false'
      );
    });

    clock.setAttribute(
      'aria-label',
      `${hoursPerDay} hour clock at ${bpm} beats per minute. Click or tap once to enable sound.`
    );

    restartScheduler();
  }

  function localMidnightEpoch(now = new Date()) {
    return new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    ).getTime();
  }

  function beatIdentity(midnightEpoch, beatIndex) {
    return `${midnightEpoch}:${bpm}:${beatIndex}`;
  }

  function cancelQueuedTicks() {
    scheduledSources.forEach(src => {
      try { src.stop(); } catch (_) {}
    });
    scheduledSources.clear();
    lastScheduledBeatKey = null;
  }

  function pitchForBeat(beatIndex) {
    // Gentle cyclic pitch drift across one complete dial revolution.
    // The cycle length follows BPM, and each value is held for two ticks.
    // Range remains only +/-1.5%.
    const cycleBeat = ((beatIndex % bpm) + bpm) % bpm;
    const pairedBeat = Math.floor(cycleBeat / 2) * 2;
    const phase = pairedBeat / bpm;
    return 1 + 0.015 * Math.sin(phase * Math.PI * 2);
  }

  function scheduleBeatAt(midnightEpoch, beatIndex, generation) {
    if (
      generation !== schedulerGeneration ||
      !soundOn ||
      !audioReady ||
      !audioCtx ||
      !mainBuffer ||
      !subBuffer
    ) return;

    const targetEpoch = midnightEpoch + beatIndex * beatMs;
    const key = beatIdentity(midnightEpoch, beatIndex);
    if (key === lastScheduledBeatKey) return;

    // 60 BPM is Main-only.
    // 40 and 80 alternate with Main on even beats, Sub on odd beats.
    const useSub = bpm !== 60 && (beatIndex % 2 === 1);
    const buffer = useSub ? subBuffer : mainBuffer;
    const onset = useSub ? SUB_ONSET_SEC : MAIN_ONSET_SEC;
    const gainValue = useSub ? 1.0 : 0.75;
    const maxDuration = useSub ? 0.11 : 0.085;

    // Web Audio scheduling is driven by an absolute beat boundary.
    // Compensate for the output pipeline so the audible transient,
    // not merely source start, lands on the dial boundary.
    const latencyMs = outputLatencySeconds() * 1000;
    const when = epochMsToAudioTime(targetEpoch - latencyMs);

    const playbackRate = pitchForBeat(beatIndex);

    playBufferAt(
      buffer,
      gainValue,
      when,
      onset,
      maxDuration,
      playbackRate
    );

    lastScheduledBeatKey = key;

    // Visual pulse is tied to the same absolute boundary.
    const pulseDelay = Math.max(0, targetEpoch - Date.now());
    setTimeout(() => {
      if (generation === schedulerGeneration) animatePulse();
    }, pulseDelay);
  }

  function armNextTick(generation) {
    if (
      generation !== schedulerGeneration ||
      !soundOn ||
      !audioReady ||
      !audioCtx ||
      !mainBuffer ||
      !subBuffer
    ) return;

    const nowEpoch = Date.now();
    const now = new Date(nowEpoch);
    const midnight = localMidnightEpoch(now);
    const elapsed = nowEpoch - midnight;

    // Always derive the next tick from the absolute clock grid.
    // No incrementing timer state means delayed callbacks cannot accumulate drift.
    let nextBeatIndex = Math.floor(elapsed / beatMs) + 1;
    let targetEpoch = midnight + nextBeatIndex * beatMs;

    // Schedule into Web Audio ahead of time. Wake ~140 ms before the exact beat.
    const lookAheadMs = 140;
    const delay = Math.max(0, targetEpoch - nowEpoch - lookAheadMs);

    schedulerTimer = setTimeout(() => {
      if (generation !== schedulerGeneration) return;

      // Re-read wall time after waking. If the browser was suspended or delayed,
      // re-lock to the first future grid boundary rather than firing stale beats.
      const wakeEpoch = Date.now();
      const wakeDate = new Date(wakeEpoch);
      const wakeMidnight = localMidnightEpoch(wakeDate);
      const wakeElapsed = wakeEpoch - wakeMidnight;
      const firstFutureBeat = Math.floor(wakeElapsed / beatMs) + 1;
      const scheduledEpoch = wakeMidnight + firstFutureBeat * beatMs;

      scheduleBeatAt(wakeMidnight, firstFutureBeat, generation);

      // Do not ask for another beat while this one is still merely queued.
      // Hand off just after this boundary; the next pass derives a fresh
      // absolute future boundary and therefore cannot accumulate timer drift.
      const handoffDelay = Math.max(0, scheduledEpoch - Date.now() + 1);
      schedulerTimer = setTimeout(() => {
        if (generation === schedulerGeneration) {
          armNextTick(generation);
        }
      }, handoffDelay);
    }, delay);
  }

  function restartScheduler() {
    schedulerGeneration += 1;
    const generation = schedulerGeneration;

    if (schedulerTimer !== null) {
      clearTimeout(schedulerTimer);
      schedulerTimer = null;
    }

    // Critical: BPM changes must remove audio already scheduled under
    // the previous grid, otherwise the old and new cadence can overlap.
    cancelQueuedTicks();

    if (soundOn && audioReady && audioCtx) {
      armNextTick(generation);
    }
  }

  function setFace(index) {
    faceIndex = ((index - 1 + FACE_COUNT) % FACE_COUNT) + 1;
    body.dataset.face = String(faceIndex);
    faceValue.textContent = `Face ${faceIndex}`;
  }

  function setColor(index) {
    colorIndex = ((index - 1 + COLOR_COUNT) % COLOR_COUNT) + 1;
    body.dataset.color = String(colorIndex);
    colorValue.textContent = `Theme ${colorIndex}`;
  }

  function setFont(index) {
    fontIndex = ((index - 1 + FONT_COUNT) % FONT_COUNT) + 1;
    const option = fontOptions[fontIndex - 1];
    clock.style.setProperty('--clock-font', option.css);
    fontValue.textContent = option.name;
  }

  function fontSizeScale() {
    // Level 1 is the previous default size (150% of the original).
    const scales = [0, 1.50, 1.70, 1.90, 2.10, 2.30];
    return scales[fontSizeLevel];
  }

  function clockSizeScale() {
    const scales = [0, 0.80, 0.90, 1.00, 1.10, 1.20];
    return scales[sizeLevel];
  }

  function applyClockTextScale() {
    // Watch size is the base scale; Font Size multiplies on top of it.
    const combined = clockSizeScale() * fontSizeScale();
    clock.style.setProperty('--clock-text-scale', String(combined));
  }

  function setFontSize(level) {
    fontSizeLevel = Math.max(1, Math.min(5, level));
    fontSizeBars.forEach((bar, i) => {
      bar.setAttribute('data-on', i < fontSizeLevel ? 'true' : 'false');
    });
    applyClockTextScale();
  }

  function setBinaryButton(button, enabled) {
    button.setAttribute('aria-pressed', enabled ? 'true' : 'false');
    button.setAttribute('data-enabled', enabled ? 'true' : 'false');
  }

  function setSound(enabled) {
    soundOn = Boolean(enabled);
    setBinaryButton(soundToggle, soundOn);

    if (!soundOn) {
      restartScheduler();
      return;
    }

    enableSound();
  }

  function setAnalogText(enabled) {
    analogTextOn = Boolean(enabled);
    body.dataset.analogText = analogTextOn ? 'on' : 'off';
    setBinaryButton(textToggle, analogTextOn);
  }

  function setTextBlur(enabled) {
    textBlurOn = Boolean(enabled);
    body.dataset.textBlur = textBlurOn ? 'on' : 'off';
    setBinaryButton(blurToggle, textBlurOn);
  }

  function setSmoothSeconds(enabled) {
    smoothSecondsOn = Boolean(enabled);
    setBinaryButton(sweepToggle, smoothSecondsOn);
  }

  function setVolume(level) {
    volumeLevel = Math.max(1, Math.min(10, level));
    volumeBars.forEach((bar, i) => {
      bar.setAttribute('data-on', i < volumeLevel ? 'true' : 'false');
    });
  }

  function setSize(level) {
    sizeLevel = Math.max(1, Math.min(5, level));
    sizeBars.forEach((bar, i) => {
      bar.setAttribute('data-on', i < sizeLevel ? 'true' : 'false');
    });
    applyClockSize();
    applyClockTextScale();
  }

  function applyClockSize() {
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    const h = window.innerHeight;
    const w = window.innerWidth;
    const compact = h <= 32.5 * rem;
    const base = compact
      ? Math.min(0.82 * w, h - 3.4 * rem, 34 * rem)
      : Math.min(0.94 * w, h - 4.75 * rem, 44 * rem);

    const widthInRem = Math.max(13.75, (base * clockSizeScale()) / rem);
    clock.style.width = `${widthInRem}rem`;
  }

  function volumeScale() {
    // Default 5 preserves the familiar loudness closely,
    // while still allowing a usable softer/louder range.
    const scales = [0, 0.28, 0.42, 0.58, 0.78, 1.0, 1.12, 1.26, 1.4, 1.55, 1.7];
    return scales[volumeLevel];
  }

  function toggleAdvanced() {
    const showingAdvanced = advancedPanel.hidden;

    advancedPanel.hidden = !showingAdvanced;
    tempoPanel.hidden = showingAdvanced;

    menuButton.setAttribute(
      'aria-expanded',
      showingAdvanced ? 'true' : 'false'
    );
  }

  clock.addEventListener('pointerdown', enableSound, { passive:true });

  clock.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      enableSound();
    }
  });

  tempoButtons.forEach(button => {
    button.addEventListener('click', async () => {
      await enableSound();
      setBpm(Number(button.dataset.bpm));
    });
  });

  menuButton.addEventListener('click', toggleAdvanced);

  facePrev.addEventListener('click', () => setFace(faceIndex - 1));
  faceNext.addEventListener('click', () => setFace(faceIndex + 1));
  colorPrev.addEventListener('click', () => setColor(colorIndex - 1));
  colorNext.addEventListener('click', () => setColor(colorIndex + 1));
  fontPrev.addEventListener('click', () => setFont(fontIndex - 1));
  fontNext.addEventListener('click', () => setFont(fontIndex + 1));
  fontSizePrev.addEventListener('click', () => setFontSize(fontSizeLevel - 1));
  fontSizeNext.addEventListener('click', () => setFontSize(fontSizeLevel + 1));
  volumePrev.addEventListener('click', () => setVolume(volumeLevel - 1));
  volumeNext.addEventListener('click', () => setVolume(volumeLevel + 1));
  sizePrev.addEventListener('click', () => setSize(sizeLevel - 1));
  sizeNext.addEventListener('click', () => setSize(sizeLevel + 1));
  soundToggle.addEventListener('click', () => setSound(!soundOn));
  textToggle.addEventListener('click', () => setAnalogText(!analogTextOn));
  blurToggle.addEventListener('click', () => setTextBlur(!textBlurOn));
  sweepToggle.addEventListener('click', () => setSmoothSeconds(!smoothSecondsOn));

  window.addEventListener('resize', applyClockSize, { passive:true });

  setFace(1);
  setColor(1);
  setFont(1);
  setFontSize(1);
  setVolume(5);
  setSize(3);
  setAnalogText(true);
  setTextBlur(false);
  setSmoothSeconds(false);
  soundOn = true;
  setBinaryButton(soundToggle, true);
  setBpm(80);
  draw();
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>

</body>
</html>
